name: Generate and Validate Adblock Collections

on:
  schedule:
    - cron: "*/20 * * * *"
  push:
    branches:
      - main
    paths:
      - "**.py"
      - "upstream_sources.json"
      - ".github/workflows/Generate and Validate Adblock Collections.yml"
  workflow_dispatch:

concurrency:
  group: generate-validate-adblock-collections
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.TOKEN || github.token }}

      - name: Synchronize main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install generator dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests aiohttp

      # Keep original Main/Lite generator implementations and CLI behavior.
      # This orchestrator changes scheduling and validation ordering only.
      - name: Generate Main Adblock collection
        run: python Adblock_Rule_Generator.py --target universal --allow-lossy

      - name: Generate Lite Adblock collection
        run: python Adblock_Rule_Generator_Lite.py --target universal --allow-lossy

      - name: Restore shared DNS validation state
        uses: actions/cache/restore@v4
        with:
          path: .cache/dns-validation-state.json
          key: dns-validation-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dns-validation-state-${{ runner.os }}-

      # The union of Main + Lite candidate targets is queried only once.
      - name: Validate both Adblock outputs once
        run: >-
          python dns_domain_validator.py
          --both-adblock
          --write
          --cache .cache/dns-validation-state.json
          --report dns-validation-report.json
          --qps 15
          --timeout 8
          --cache-ttl-hours 6
          --min-healthy-resolvers 3
          --max-removal-ratio 0.20

      - name: Save shared DNS validation state
        uses: actions/cache/save@v4
        with:
          path: .cache/dns-validation-state.json
          key: dns-validation-state-${{ runner.os }}-${{ github.run_id }}

      - name: Upload generation and DNS audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adblock-generation-dns-audit
          path: |
            ADBLOCK_RULE_COLLECTION.semantic-report.json
            ADBLOCK_RULE_COLLECTION_Lite.semantic-report.json
            dns-validation-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit and safely publish both validated lists
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN || github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ADBLOCK_RULE_COLLECTION.txt ADBLOCK_RULE_COLLECTION_Lite.txt
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git commit -m "Update validated AdBlock collections"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase -X ours origin/main; then
              git rebase --abort || true
              echo "::error::Unable to rebase generated lists onto current main."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Both validated Adblock lists published successfully."
              exit 0
            fi
            echo "Push conflict or concurrent update; retry ${attempt}/5."
            sleep $((attempt * 2))
          done

          echo "::error::Unable to publish validated Adblock lists after five attempts."
          exit 1
