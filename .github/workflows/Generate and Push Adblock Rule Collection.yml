name: Generate and Push Adblock Rule Collection

on:
  schedule:
    - cron: "*/20 * * * *"  # 每20分钟运行一次
  push:
    branches:
      - main  # 确保在main分支上运行
  workflow_dispatch:  # 允许手动触发工作流

jobs:
  generate_and_push:
    runs-on: ubuntu-latest  # 使用最新的Ubuntu环境

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3  # 签出仓库的代码

    - name: 同步远程分支
      shell: bash
      run: |
        set -euo pipefail
        branch="${GITHUB_REF_NAME}"
        git fetch origin "$branch"
        git pull --rebase origin "$branch"

    - name: Set up Python
      uses: actions/setup-python@v4  # 设置Python环境
      with:
        python-version: '3.x'  # 指定Python版本

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip  # 升级pip
        pip install requests aiohttp  # 安装requests和aiohttp库

    - name: Run Adblock Rule Generator
      run: python Adblock_Rule_Generator.py --target adguard-windows  # 生成 AdGuard for Windows 网络过滤规则

    - name: Commit and safely push changes
      id: push_changes  # 设置步骤ID以供后续引用
      shell: bash
      run: |
        set -euo pipefail
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add ADBLOCK_RULE_COLLECTION.txt
        if git diff --cached --quiet; then
          echo "No changes to commit."
          exit 0
        fi
        git commit -m "Update AdBlock rules"
        set -euo pipefail
        branch="${GITHUB_REF_NAME}"
        git fetch origin "$branch"
        if ! git rebase -X ours "origin/$branch"; then
          git rebase --abort || true
          echo "::error::与远程分支同步失败，停止推送以避免覆盖远程提交。"
          exit 1
        fi
        if git push origin "HEAD:$branch"; then
          echo "Push successful."
          exit 0
        fi
        for attempt in 1 2 3 4 5; do
          echo "推送遇到并发更新；第 ${attempt} 次重新拉取远程分支并尝试变基。"
          git fetch origin "$branch"
          if ! git rebase -X ours "origin/$branch"; then
            git rebase --abort || true
            echo "::error::无法自动同步远程提交。"
            exit 1
          fi
          if git push origin "HEAD:$branch"; then
            echo "Push successful."
            exit 0
          fi
          sleep $((attempt * 2))
        done
        echo "::error::多次尝试后仍无法推送。"
        exit 1
      env:
        GITHUB_TOKEN: ${{ secrets.TOKEN }}
