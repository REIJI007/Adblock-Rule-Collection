name: Generate and Push Adblock Rule Collection

on:
  workflow_dispatch:  # 保留单独手动生成入口

jobs:
  generate_and_push:
    runs-on: ubuntu-latest  # 使用最新的Ubuntu环境
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3  # 签出仓库的代码

    - name: 同步远程分支
      shell: bash
      run: |
        set -euo pipefail
        branch="${GITHUB_REF_NAME}"
        git fetch origin "$branch"
        git pull --rebase origin "$branch"

    - name: Set up Python
      uses: actions/setup-python@v4  # 设置Python环境
      with:
        python-version: '3.x'  # 指定Python版本

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip  # 升级pip
        pip install requests aiohttp  # 安装requests和aiohttp库

    - name: Run Adblock Rule Generator
      run: python Adblock_Rule_Generator.py --target universal --allow-lossy  # 生成跨引擎通用规则（AdGuard Windows + AdGuard MV2 + uBO MV2）

    - name: Restore Main DNS validation cache
      uses: actions/cache/restore@v4
      with:
        path: .cache/dns-validation-main.json
        key: dns-validation-main-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          dns-validation-main-${{ runner.os }}-

    - name: Validate generated Adblock domains (five unfiltered DNS resolvers)
      run: >-
        python dns_domain_validator.py ADBLOCK_RULE_COLLECTION.txt
        --write
        --cache .cache/dns-validation-main.json
        --report dns-validation-main.json
        --qps 18
        --timeout 8
        --cache-ttl-hours 0.25

    - name: Save Main DNS validation cache
      uses: actions/cache/save@v4
      with:
        path: .cache/dns-validation-main.json
        key: dns-validation-main-${{ runner.os }}-${{ github.run_id }}


    - name: Upload universal compatibility audit
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: universal-main-compatibility-audit
        path: |
          ADBLOCK_RULE_COLLECTION.semantic-report.json
          dns-validation-main.json
        if-no-files-found: warn

    - name: Commit and safely push changes
      id: push_changes  # 设置步骤ID以供后续引用
      shell: bash
      run: |
        set -euo pipefail
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add ADBLOCK_RULE_COLLECTION.txt
        if git diff --cached --quiet; then
          echo "No changes to commit."
          exit 0
        fi
        git commit -m "Update AdBlock rules"
        set -euo pipefail
        branch="${GITHUB_REF_NAME}"
        git fetch origin "$branch"
        if ! git rebase -X ours "origin/$branch"; then
          git rebase --abort || true
          echo "::error::与远程分支同步失败，停止推送以避免覆盖远程提交。"
          exit 1
        fi
        if git push origin "HEAD:$branch"; then
          echo "Push successful."
          exit 0
        fi
        for attempt in 1 2 3 4 5; do
          echo "推送遇到并发更新；第 ${attempt} 次重新拉取远程分支并尝试变基。"
          git fetch origin "$branch"
          if ! git rebase -X ours "origin/$branch"; then
            git rebase --abort || true
            echo "::error::无法自动同步远程提交。"
            exit 1
          fi
          if git push origin "HEAD:$branch"; then
            echo "Push successful."
            exit 0
          fi
          sleep $((attempt * 2))
        done
        echo "::error::多次尝试后仍无法推送。"
        exit 1
      env:
        GITHUB_TOKEN: ${{ secrets.TOKEN }}
