name: Generate Block Domain List

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  filter-rules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: 同步远程分支
        shell: bash
        run: |
          set -euo pipefail
          branch="main"
          git fetch origin "$branch"
          git pull --rebase origin "$branch"

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytz

      - name: Process AdBlock rules
        run: |
          python3 << 'EOF'
          import datetime
          import pytz
          import re
          import textwrap

          dns_domain_regex = re.compile(
              r'^(?!-)[A-Za-z0-9-]{1,63}(?<!-)(\.[A-Za-z0-9-]{1,63})*\.[A-Za-z]{2,}$'
          )

          def is_valid_domain(domain):
              return (
                  not re.fullmatch(r'\d+\.\d+\.\d+\.\d+', domain)
                  and dns_domain_regex.fullmatch(domain) is not None
              )

          def extract_domains(lines):
              blocks = set()
              exceptions = set()
              badfilters = set()

              for raw_line in lines:
                  line = raw_line.strip()

                  if not line or line.startswith(('!', '#')):
                      continue

                  line = line.lower()

                  # $badfilter 规则只会取消与其对应的那一条规则。
                  # 只有在移除 $badfilter 后仍得到纯粹的
                  # 域名规则时才接受；其他修饰符会改变规则本身的含义。
                  bad_match = re.fullmatch(
                      r'(?P<exception>@@)?\|\|(?P<domain>[a-z0-9.-]+)\^\$badfilter',
                      line
                  )
                  if bad_match:
                      domain = bad_match.group('domain')
                      if is_valid_domain(domain):
                          badfilters.add((bool(bad_match.group('exception')), domain))
                      continue

                  # 只有无条件的域名例外规则才能安全地应用到
                  # 整个 DNS 域名列表。带有修饰符的例外规则（例如
                  # $script）只针对特定请求资源，因此会被有意忽略。
                  exception_match = re.fullmatch(
                      r'@@\|\|([a-z0-9.-]+)\^',
                      line
                  )
                  if exception_match:
                      domain = exception_match.group(1)
                      if is_valid_domain(domain):
                          exceptions.add(domain)
                      continue

                  # 此列表仅收录纯域名拦截规则。
                  block_match = re.fullmatch(
                      r'\|\|([a-z0-9.-]+)\^',
                      line
                  )
                  if block_match:
                      domain = block_match.group(1)
                      if is_valid_domain(domain):
                          blocks.add(domain)

              # $badfilter 只会移除完全匹配的域名规则。
              # 尤其不能删除单独列出的子域名规则。
              active_blocks = {
                  domain for domain in blocks
                  if (False, domain) not in badfilters
              }

              # 同样，badfilter 也可以禁用一条例外规则。这里只应用
              # 仍然有效的例外规则，然后排除与其匹配的整个子域名范围。
              active_exceptions = {
                  domain for domain in exceptions
                  if (True, domain) not in badfilters
              }

              return sorted(
                  domain for domain in active_blocks
                  if not any(
                      domain == exception or domain.endswith("." + exception)
                      for exception in active_exceptions
                  )
              )

          def run_regression_tests():
              cases = [
                  (
                      "badfilter only cancels the exact block rule",
                      [
                          "||example.com^",
                          "||child.example.com^",
                          "||other.example.net^",
                          "||example.com^$badfilter",
                      ],
                      ["child.example.com", "other.example.net"],
                  ),
                  (
                      "exception-only domains are never added to the block list",
                      [
                          "@@||allow.example.com^",
                      ],
                      [],
                  ),
                  (
                      "unconditional exception excludes its subtree",
                      [
                          "||example.com^",
                          "||child.example.com^",
                          "||keep.example.net^",
                          "@@||example.com^",
                      ],
                      ["keep.example.net"],
                  ),
                  (
                      "badfilter disables the matching exception",
                      [
                          "||example.com^",
                          "||child.example.com^",
                          "@@||example.com^",
                          "@@||example.com^$badfilter",
                      ],
                      ["child.example.com", "example.com"],
                  ),
                  (
                      "badfilter with another modifier does not cancel a pure rule",
                      [
                          "||example.com^",
                          "||child.example.com^",
                          "||example.com^$important,badfilter",
                      ],
                      ["child.example.com", "example.com"],
                  ),
                  (
                      "resource-specific exception is not applied globally",
                      [
                          "||example.com^",
                          "@@||example.com^$script",
                      ],
                      ["example.com"],
                  ),
              ]

              for name, rules, expected in cases:
                  actual = extract_domains(rules)
                  if actual != expected:
                      raise AssertionError(
                          f"Regression test failed: {name}; "
                          f"expected {expected}, got {actual}"
                      )

              print(f"Passed {len(cases)} domain-list regression tests.")

          def process_file(input_file, output_file, title):
              with open(input_file, 'r', encoding='utf-8') as f:
                  domains = extract_domains(f)

              tz = pytz.timezone('Asia/Shanghai')
              timestamp = datetime.datetime.now(tz).strftime('%Y-%m-%d %H:%M:%S')

              # 使用 textwrap.dedent 去除多行字符串的缩进和前导空白
              header = textwrap.dedent(f"""\
              #Title: {title}
              #Description: 一个汇总了多个广告过滤器过滤规则的拦截域名列表，每20分钟更新一次，确保即时同步上游减少误杀
              #Homepage: https://github.com/REIJI007/Adblock-Rule-Collection
              #LICENSE1: https://github.com/REIJI007/Adblock-Rule-Collection/blob/main/LICENSE-GPL 3.0
              #LICENSE2: https://github.com/REIJI007/Adblock-Rule-Collection/blob/main/LICENSE-CC-BY-NC-SA 4.0
              #生成时间: {timestamp}
              #有效域名数目: {len(domains)}""")

              with open(output_file, 'w', encoding='utf-8') as f:
                  f.write(header + '\n\n')
                  f.write('\n'.join(domains) + '\n')

              print(f"Processed {input_file}. Total domains: {len(domains)}")

          run_regression_tests()
          process_file('ADBLOCK_RULE_COLLECTION.txt', 'ADBLOCK_RULE_COLLECTION_DOMAIN.txt', 'Adblock-Rule-Collection-Domain')
          process_file('ADBLOCK_RULE_COLLECTION_Lite.txt', 'ADBLOCK_RULE_COLLECTION_DOMAIN_Lite.txt', 'Adblock-Rule-Collection-Domain-Lite')
          EOF

      - name: Commit and safely push changes
        shell: bash
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update AdBlock Domain rules"
          set -euo pipefail
          branch="main"
          git fetch origin "$branch"
          if ! git rebase -X ours "origin/$branch"; then
            git rebase --abort || true
            echo "::error::与远程分支同步失败，停止推送以避免覆盖远程提交。"
            exit 1
          fi
          if git push origin "HEAD:$branch"; then
            echo "Push successful."
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            echo "推送遇到并发更新；第 ${attempt} 次重新拉取远程分支并尝试变基。"
            git fetch origin "$branch"
            if ! git rebase -X ours "origin/$branch"; then
              git rebase --abort || true
              echo "::error::无法自动同步远程提交。"
              exit 1
            fi
            if git push origin "HEAD:$branch"; then
              echo "Push successful."
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "::error::多次尝试后仍无法推送。"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
