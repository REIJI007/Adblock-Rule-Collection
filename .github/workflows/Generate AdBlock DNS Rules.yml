name: Generate AdBlock DNS Rules

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

concurrency:
  group: generate-adblock-dns-rules
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  filter-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Convert and validate AdGuard DNS rules
        run: python3 .github/scripts/adguard_dns_converter.py
      - name: Commit and push changes
        run: |
          set -euo pipefail

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add -- \
            ADBLOCK_RULE_COLLECTION_DNS.txt \
            ADBLOCK_RULE_COLLECTION_DNS_Lite.txt

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update AdBlock DNS rules"

          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:main
