name: Generate AdBlock DNS Rules

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

concurrency:
  group: generate-adblock-dns-rules
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  filter-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Convert and validate AdGuard DNS rules
        shell: python3 {0}
        run: |
          import datetime
          import ipaddress
          import os
          import re
          from collections import Counter
          from pathlib import Path
          from zoneinfo import ZoneInfo


          # 单个域名标签：字母数字开头结尾，中间可含连字符，总长不超过 63
          DOMAIN_LABEL_RE = re.compile(
              r"[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\Z",
              re.IGNORECASE,
          )

          # 列表头部元数据，如 [Adblock Plus 2.0]、[AdGuard 1.0]，不属于过滤规则
          ADBLOCK_HEADER_RE = re.compile(
              r"^\[(?:Adblock Plus|AdGuard)\s+\d+(?:\.\d+)*\]$",
              re.IGNORECASE,
          )

          # $dnstype 修饰符允许出现的 DNS 记录类型白名单
          DNS_TYPES = set("""
              A AAAA A6 AFSDB AMTRELAY ANY APL ATMA AVC AXFR
              CAA CDNSKEY CDS CERT CNAME CSYNC DHCID DLV DNAME
              DNSKEY DOA DS EID EUI48 EUI64 GID GPOS HINFO HIP
              HTTPS IPSECKEY ISDN IXFR KEY KX L32 L64 LOC MAILA
              MAILB MB MD MF MG MINFO MR MX NAPTR NID NIMLOC NS
              NSAP NSAP-PTR NSEC NSEC3 NSEC3PARAM NULL NXT
              OPENPGPKEY OPT PTR PX RKEY RP RRSIG RT SIG SMIMEA
              SOA SPF SRV SSHFP SVCB TA TALINK TKEY TLSA TSIG TXT
              UINFO UID UNSPEC URI WKS ZONEMD
          """.split())

          # 本转换器仅接受的修饰符子集（其余依赖运行环境或存在兼容性问题，一律拒绝）
          # AdGuard DNS-native modifiers. Browser-context modifiers are rejected,
          # never stripped, because removing them can widen a rule's meaning.
          ALLOWED_MODIFIERS = {
              "client",
              "denyallow",
              "dnstype",
              "dnsrewrite",
              "important",
          }

          class FatalConversionError(RuntimeError):
              # 致命错误：继续发布会导致规则语义不安全，必须中止整个流程
              pass

          def canonical_domain(value: str):
              # 校验主机名，成功则返回小写 ASCII（IDNA）形式，失败返回 None
              # 允许尾随的根点（会被移除）；拒绝通配符、空标签、URL 语法与 IP 字面量
              if not value or value != value.strip():
                  return None

              if value.endswith(".."):
                  return None

              # 去掉 DNS 根点
              if value.endswith("."):
                  value = value[:-1]

              if not value or len(value) > 253 or "*" in value:
                  return None

              try:
                  labels = value.split(".")
                  if any(not label for label in labels):
                      return None

                  ascii_labels = []
                  for label in labels:
                      # 国际化域名转为 punycode 并统一小写
                      ascii_label = label.encode("idna").decode("ascii").lower()

                      if len(ascii_label) > 63:
                          return None

                      if not DOMAIN_LABEL_RE.fullmatch(ascii_label):
                          return None

                      ascii_labels.append(ascii_label)

                  result = ".".join(ascii_labels)

                  if len(result) > 253:
                      return None

                  # IP 字面量不能当作主机名规则处理
                  try:
                      ipaddress.ip_address(result)
                      return None
                  except ValueError:
                      pass

                  return result

              except (UnicodeError, ValueError):
                  return None

          def parse_dns_type_value(value: str):
              # 校验并规范化 $dnstype 的值，返回 (规范化结果, 错误信息)
              # 支持正向列表 A|AAAA 或反向列表 ~A|~AAAA；混合列表有歧义，直接拒绝
              if not value or value != value.strip():
                  return None, "invalid dnstype value"

              components = value.split("|")

              if any(not item for item in components):
                  return None, "empty dnstype entry"

              normalized = []
              negation_modes = set()

              for item in components:
                  negated = item.startswith("~")
                  type_name = item[1:] if negated else item

                  if not type_name:
                      return None, "empty dnstype name"

                  type_name = type_name.upper()

                  if not re.fullmatch(r"[A-Z0-9]+", type_name):
                      return None, f"invalid dnstype name: {type_name}"

                  if type_name not in DNS_TYPES:
                      return None, f"unsupported dnstype: {type_name}"

                  negation_modes.add(negated)
                  normalized.append(("~" if negated else "") + type_name)

              # 同一列表中不允许同时出现正向与反向条目
              if len(negation_modes) > 1:
                  return None, "mixed positive and negative dnstype entries"

              if len(set(normalized)) != len(normalized):
                  return None, "duplicate dnstype entry"

              # RR type ordering is semantically irrelevant; sort for canonicalization.
              return "|".join(sorted(normalized)), None

          def split_outside_quotes(value: str, separator: str):
              # Split outside quoted strings; preserve escapes so client names retain their meaning.
              parts = []
              current = []
              quote = None
              escaped = False

              for char in value:
                  if escaped:
                      current.append(char)
                      escaped = False
                      continue

                  if quote is not None and char == "\\":
                      current.append(char)
                      escaped = True
                      continue

                  if quote is not None:
                      current.append(char)
                      if char == quote:
                          quote = None
                      continue

                  if char in ("'", '"'):
                      quote = char
                      current.append(char)
                  elif char == separator:
                      # A dollar sign inside a slash-delimited regex is part of the
                      # pattern, not the modifier delimiter.
                      if (
                          separator == "$"
                          and current
                          and current[0] == "/"
                          and "".join(current).rfind("/") == 0
                      ):
                          current.append(char)
                      else:
                          parts.append("".join(current).strip())
                          current = []
                  else:
                      current.append(char)

              if quote is not None or escaped:
                  return None, "unterminated quoted or escaped value"

              parts.append("".join(current).strip())
              return parts, None


          def parse_denyallow_value(value: str):
              # denyallow's domain order does not affect semantics; normalize and sort it.
              if not value or value != value.strip():
                  return None, "invalid denyallow value"

              raw_domains = value.split("|")
              if any(not item or item != item.strip() for item in raw_domains):
                  return None, "empty or whitespace-padded denyallow domain"

              domains = []
              for raw_domain in raw_domains:
                  domain = canonical_domain(raw_domain)
                  if not domain:
                      return None, f"invalid denyallow domain: {raw_domain}"
                  domains.append(domain)

              if len(set(domains)) != len(domains):
                  return None, "duplicate denyallow domain"

              return "|".join(sorted(domains)), None


          def validate_client_value(value: str):
              # AdGuard DNS client entries may be IP/CIDR or client names; ~ excludes an entry.
              # Preserve the original value: client identifiers may be case-sensitive.
              if not value or value != value.strip():
                  return None, "invalid client value"

              if any(ord(char) < 32 or ord(char) == 127 for char in value):
                  return None, "control character in client value"

              entries, error = split_outside_quotes(value, "|")
              if error:
                  return None, error
              if any(not entry for entry in entries):
                  return None, "empty client entry"

              for entry in entries:
                  if entry.startswith("~"):
                      item = entry[1:]
                      if not item or item != item.strip():
                          return None, "invalid whitespace or empty negated client entry"
                  else:
                      item = entry
                  if not item:
                      return None, "empty client entry"

                  if item.startswith(("'", '"')):
                      quote = item[0]
                      if len(item) < 2 or item[-1] != quote:
                          return None, "malformed quoted client name"
                  elif any(char in item for char in ("'", '"', "\\")):
                      return None, "quotes and escapes in client names must be quoted"
                  elif any(char.isspace() for char in item):
                      return None, "client names containing whitespace must be quoted"

              return value, None


          def validate_dnsrewrite_value(value: str):
              # Preserve supported AdGuard DNS response-rewrite forms verbatim.
              # Unknown/malformed payloads are skipped rather than silently changed.
              if not value or value != value.strip():
                  return None, "invalid dnsrewrite value"
              if any(ord(char) < 32 or ord(char) == 127 for char in value):
                  return None, "control character in dnsrewrite value"

              try:
                  address = ipaddress.ip_address(value)
                  return str(address), None
              except ValueError:
                  pass

              if value in {"NOERROR", "NXDOMAIN", "REFUSED", "SERVFAIL", "FORMERR"}:
                  return value, None

              fields = value.split(";")
              if len(fields) != 3:
                  domain = canonical_domain(value.rstrip("."))
                  if domain:
                      return domain, None
                  return None, "unsupported dnsrewrite shorthand"

              rcode, rrtype, payload = fields
              allowed_rcodes = {
                  "NOERROR", "FORMERR", "SERVFAIL", "NXDOMAIN",
                  "NOTIMP", "REFUSED", "YXDOMAIN", "YXRRSET",
                  "NXRRSET", "NOTAUTH", "NOTZONE",
              }
              if rcode not in allowed_rcodes:
                  return None, f"unsupported dnsrewrite response code: {rcode}"
              if rcode != "NOERROR":
                  if rrtype or payload:
                      return None, "non-NOERROR dnsrewrite must have empty RR type and value"
                  return value, None
              if not rrtype and not payload:
                  return value, None
              if rrtype not in DNS_TYPES:
                  return None, f"unsupported dnsrewrite RR type: {rrtype}"
              if rrtype in {"A", "AAAA"}:
                  try:
                      address = ipaddress.ip_address(payload)
                  except ValueError:
                      return None, f"invalid dnsrewrite IP address: {payload}"
                  if (rrtype == "A" and address.version != 4) or (rrtype == "AAAA" and address.version != 6):
                      return None, f"dnsrewrite address family does not match {rrtype}"
                  payload = str(address)
              elif rrtype in {"CNAME", "NS", "PTR"}:
                  domain = canonical_domain(payload.rstrip("."))
                  if not domain:
                      return None, f"invalid dnsrewrite domain: {payload}"
                  payload = domain
              elif not payload and rrtype not in {"TXT", "MX", "SRV", "HTTPS", "SVCB", "PTR"}:
                  return None, f"empty dnsrewrite payload for {rrtype}"
              return f"{rcode};{rrtype};{payload}", None


          def parse_modifiers(modifier_text: str):
              # Only accept modifiers with defined DNS semantics. Unknown modifiers are
              # rejected instead of being stripped, which could broaden block/allow scope.
              if not modifier_text:
                  return None, "empty modifier list"

              raw_modifiers, split_error = split_outside_quotes(modifier_text, ",")
              if split_error:
                  return None, split_error
              if any(not item for item in raw_modifiers):
                  return None, "malformed modifier list"

              normalized = []
              seen = set()

              for token in raw_modifiers:
                  key, separator, value = token.partition("=")
                  key = key.strip().lower()
                  value = value.strip()

                  if not key:
                      return None, "empty modifier name"
                  if key == "badfilter":
                      return None, "badfilter is not allowed in output rules"
                  if key not in ALLOWED_MODIFIERS:
                      return None, f"unsupported or non-portable modifier: {key}"
                  if key in seen:
                      return None, f"duplicate modifier: {key}"
                  seen.add(key)

                  if key == "important":
                      if separator:
                          return None, "important must not have a value"
                      normalized.append(("important", None))
                      continue

                  if not separator:
                      return None, f"{key} requires a value"

                  if key == "dnstype":
                      parsed_value, error = parse_dns_type_value(value)
                  elif key == "denyallow":
                      parsed_value, error = parse_denyallow_value(value)
                  elif key == "client":
                      parsed_value, error = validate_client_value(value)
                  elif key == "dnsrewrite":
                      parsed_value, error = validate_dnsrewrite_value(value)
                  else:
                      return None, f"unsupported modifier: {key}"

                  if error:
                      return None, error
                  normalized.append((key, parsed_value))

              # Modifier order does not affect semantics; sort for deterministic deduplication.
              normalized.sort(key=lambda item: item[0])
              result = []
              for key, value in normalized:
                  result.append(key if value is None else f"{key}={value}")

              return ",".join(result), None


          def validate_hostname_regex(pattern: str):
              # DNS regexes are evaluated against hostnames, not browser URLs.
              # Perform generic lexical checks rather than matching a denylist of
              # known bad patterns. Reject expressions that require URL/Adblock
              # characters, use unsupported regex constructs, or are numeric-only
              # address patterns with no hostname-label evidence.
              if not pattern.startswith("/") or not pattern.endswith("/") or len(pattern) <= 2:
                  return "malformed hostname regular expression"

              expression = pattern[1:-1]
              try:
                  re.compile(expression)
              except re.error:
                  return "invalid regular-expression pattern"

              hostname_chars = set(
                  "abcdefghijklmnopqrstuvwxyz"
                  "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
                  "0123456789._-"
              )
              word_chars = set(
                  "abcdefghijklmnopqrstuvwxyz"
                  "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
                  "0123456789_"
              )
              digit_chars = set("0123456789")
              has_alpha_evidence = False
              has_numeric_evidence = False

              def record_characters(characters):
                  nonlocal has_alpha_evidence, has_numeric_evidence
                  if any(char.isalpha() or char == "_" for char in characters):
                      has_alpha_evidence = True
                  if any(char.isdigit() for char in characters):
                      has_numeric_evidence = True

              def parse_character_class(source, opening_index):
                  # Accept only positive classes/ranges whose complete character
                  # set is hostname-safe. Complements and broad classes such as
                  # [\s\S] are too unconstrained for a conservative converter.
                  index = opening_index + 1
                  if index >= len(source) or source[index] == "^":
                      return None, None, "negated or empty hostname character class"

                  tokens = []
                  while index < len(source):
                      char = source[index]
                      if char == "]":
                          break

                      if char == "\\":
                          if index + 1 >= len(source):
                              return None, None, "unterminated character-class escape"
                          escaped = source[index + 1]
                          if escaped == "d":
                              tokens.append(("set", digit_chars))
                          elif escaped == "w":
                              tokens.append(("set", word_chars))
                          elif escaped in (".", "-", "_"):
                              tokens.append(("char", escaped))
                          else:
                              return (
                                  None,
                                  None,
                                  "character class can match non-hostname characters "
                                  "or uses an unsupported escape",
                              )
                          index += 2
                          continue

                      if char not in hostname_chars:
                          return (
                              None,
                              None,
                              "character class contains characters outside hostname syntax",
                          )
                      tokens.append(("char", char))
                      index += 1

                  if index >= len(source) or source[index] != "]":
                      return None, None, "unterminated hostname character class"
                  if not tokens:
                      return None, None, "empty hostname character class"

                  possible = set()
                  token_index = 0
                  while token_index < len(tokens):
                      if (
                          token_index + 2 < len(tokens)
                          and tokens[token_index][0] == "char"
                          and tokens[token_index + 1] == ("char", "-")
                          and tokens[token_index + 2][0] == "char"
                      ):
                          lower = ord(tokens[token_index][1])
                          upper = ord(tokens[token_index + 2][1])
                          if lower > upper:
                              return None, None, "reversed character-class range"
                          ranged = {chr(codepoint) for codepoint in range(lower, upper + 1)}
                          if not ranged.issubset(hostname_chars):
                              return (
                                  None,
                                  None,
                                  "character-class range includes non-hostname characters",
                              )
                          possible.update(ranged)
                          token_index += 3
                          continue

                      kind, value = tokens[token_index]
                      if kind == "set":
                          possible.update(value)
                      else:
                          if value == "-" and token_index not in (0, len(tokens) - 1):
                              return (
                                  None,
                                  None,
                                  "ambiguous hyphen in hostname character class",
                              )
                          possible.add(value)
                      token_index += 1

                  return index + 1, possible, None

              index = 0
              while index < len(expression):
                  char = expression[index]

                  if char == "\\":
                      if index + 1 >= len(expression):
                          return "trailing backslash in hostname regex"

                      escaped = expression[index + 1]
                      if escaped == "d":
                          record_characters(digit_chars)
                      elif escaped == "w":
                          record_characters(word_chars)
                      elif escaped in (".", "-", "_"):
                          record_characters({escaped})
                      elif escaped in ("A", "z", "b", "B"):
                          # Zero-width assertions supported by RE2-style regex engines.
                          pass
                      else:
                          # This rejects escaped URL slashes, literal pipes/carets,
                          # browser-filter punctuation, backreferences and broad /
                          # engine-specific escapes rather than guessing their meaning.
                          return (
                              "unsupported escape or literal outside hostname syntax: "
                              f"\\{escaped}"
                          )
                      index += 2
                      continue

                  if char == "[":
                      next_index, possible, error = parse_character_class(
                          expression,
                          index,
                      )
                      if error:
                          return error
                      record_characters(possible)
                      index = next_index
                      continue

                  if char == "(":
                      if expression.startswith("(?:", index):
                          index += 3
                          continue

                      if expression.startswith("(?", index):
                          # Permit only RE2-compatible inline flags. Lookarounds,
                          # Python-only groups and other extensions are rejected.
                          flag_group = re.match(
                              r"\(\?(?:[ims]+(?:-[ims]+)?|-[ims]+)(?::|\))",
                              expression[index:],
                          )
                          if not flag_group:
                              return "unsupported regex group construct"
                          index += flag_group.end()
                          continue

                      index += 1
                      continue

                  if char == "{":
                      # Counted repetitions must use regex syntax, not literal braces.
                      repetition = re.match(
                          r"\{([0-9]+)(?:,([0-9]*))?\}",
                          expression[index:],
                      )
                      if not repetition:
                          return "unsupported literal brace in hostname regex"
                      numbers = [
                          int(number)
                          for number in repetition.groups()
                          if number is not None
                      ]
                      if any(number > 1000 for number in numbers):
                          return "regex repetition exceeds the target engine limit"
                      index += repetition.end()
                      continue

                  if char == ".":
                      # A regex wildcard is valid here: the target engine supplies
                      # hostnames as input, so it cannot make the rule match a URL.
                      index += 1
                      continue

                  if char in hostname_chars:
                      record_characters({char})
                      index += 1
                      continue

                  if char in "^$*+?}|)":
                      # Regex operators/anchors are syntax, not matched URL characters.
                      # Python's compile check above rejects invalid operator placement.
                      if char == "}":
                          return "unmatched closing brace in hostname regex"
                      index += 1
                      continue

                  # Characters such as / : ! # = , ; @ % and whitespace are not
                  # valid hostname characters. If written as literals outside a
                  # class they make a URL/network/browser-rule pattern, not a host mask.
                  return (
                      "regex contains a literal character outside hostname syntax: "
                      f"{char!r}",
                  )[0]

              if has_numeric_evidence and not has_alpha_evidence:
                  return (
                      "numeric-only regex resembles an IP/address pattern, "
                      "not a hostname rule"
                  )

              return None


          def parse_adguard_dns_rule(candidate: str, allow_exact_anchor=True):
              # Parse supported AdGuard DNS rules without widening their hostname scope.
              # ||domain^ covers the domain and subdomains; |domain^ covers only that host.
              # Browser-context modifiers are rejected rather than silently removed.
              if not candidate:
                  return None, "empty rule"

              if any(ord(char) < 32 or ord(char) == 127 for char in candidate):
                  return None, "control character in rule"

              # 拆分白名单前缀 @@
              allow_prefix = "@@" if candidate.startswith("@@") else ""
              body = candidate[len(allow_prefix):]

              if body.startswith("@@"):
                  return None, "misplaced exception marker"

              # Split on unquoted "$" delimiters, because a quoted client name may contain "$".
              parts, split_error = split_outside_quotes(body, "$")
              if split_error:
                  return None, split_error
              if len(parts) > 2:
                  return None, "multiple modifier delimiters"

              pattern = parts[0]
              modifier_text = parts[1] if len(parts) == 2 else None

              domain_pattern = None
              exact_anchor = False

              # A bare hostname blocks only that hostname; normalize to its exact-host
              # equivalent so it retains the original matching scope.
              if not pattern.startswith(("/", "|")) and "*" not in pattern:
                  bare_domain = canonical_domain(pattern)
                  if bare_domain:
                      normalized = f"{allow_prefix}|{bare_domain}^"
                      if modifier_text is not None:
                          normalized_modifiers, error = parse_modifiers(modifier_text)
                          if error:
                              return None, error
                          normalized += "$" + normalized_modifiers
                      return normalized, None

              if (
                  pattern.startswith("||")
                  and pattern.endswith("^")
                  and "*" not in pattern[2:-1]
              ):
                  # 标准形式：匹配域名及其全部子域名
                  domain_pattern = pattern[2:-1]

              elif (
                  allow_exact_anchor
                  and pattern.startswith("|")
                  and not pattern.startswith("||")
                  and pattern.endswith("^")
              ):
                  # 精确锚点形式：仅匹配该主机名本身
                  domain_pattern = pattern[1:-1]
                  exact_anchor = True

              elif pattern.startswith("/") and pattern.endswith("/") and len(pattern) > 2:
                  # AdGuard DNS regex masks match hostnames only. A successful
                  # Python compile is not enough: URL/path, IP:port, and regexes
                  # that target Adblock syntax must be rejected.
                  regex_error = validate_hostname_regex(pattern)
                  if regex_error:
                      return None, regex_error
                  normalized = allow_prefix + pattern
                  if modifier_text is not None:
                      normalized_modifiers, error = parse_modifiers(modifier_text)
                      if error:
                          return None, error
                      normalized += "$" + normalized_modifiers
                  return normalized, None

              elif pattern.startswith("||") and pattern.endswith("^") and "*" in pattern[2:-1]:
                  # Preserve wildcard hostname masks supported by AdGuard DNS.
                  wildcard_domain = pattern[2:-1].lower()
                  if not re.fullmatch(r"[a-z0-9*.-]+", wildcard_domain):
                      return None, "unsupported wildcard hostname pattern"
                  labels = wildcard_domain.split(".")
                  if any(not label or label.startswith("-") or label.endswith("-") for label in labels):
                      return None, "invalid wildcard hostname label"
                  if len(wildcard_domain) > 253 or any(len(label) > 63 for label in labels):
                      return None, "wildcard hostname exceeds DNS length limits"
                  normalized = allow_prefix + "||" + wildcard_domain + "^"
                  if modifier_text is not None:
                      normalized_modifiers, error = parse_modifiers(modifier_text)
                      if error:
                          return None, error
                      normalized += "$" + normalized_modifiers
                  return normalized, None

              else:
                  return None, "pattern is not a supported AdGuard DNS hostname rule"

              # 主机名部分不得含任何特殊语法字符
              if (
                  not domain_pattern
                  or "^" in domain_pattern
                  or "|" in domain_pattern
                  or "/" in domain_pattern
                  or "\\" in domain_pattern
                  or "?" in domain_pattern
                  or "#" in domain_pattern
                  or "$" in domain_pattern
                  or "*" in domain_pattern
              ):
                  return None, "unsupported hostname pattern"

              domain = canonical_domain(domain_pattern)

              if not domain:
                  return None, "invalid hostname or IP literal"

              if exact_anchor:
                  normalized = f"{allow_prefix}|{domain}^"
              else:
                  normalized = f"{allow_prefix}||{domain}^"

              if modifier_text is not None:
                  normalized_modifiers, error = parse_modifiers(modifier_text)

                  if error:
                      return None, error

                  normalized += "$" + normalized_modifiers

              return normalized, None

          def parse_hosts_as_adguard(line: str):
              # 识别 Hosts 格式行，返回 (是否为Hosts行, 规则列表, 错误信息)
              # 仅将未指定地址（0.0.0.0 等）或环回地址视为屏蔽映射；
              # 其他 IP 映射无法等价表示为屏蔽规则，予以拒绝
              # Hosts 条目只作用于所列主机名本身，不含子域名，
              # 因此输出为 |domain^ 而非 ||domain^
              body = line.split("#", 1)[0].strip()

              if not body:
                  return False, None, None

              parts = body.split()

              # 首段不是 IP 则不是 Hosts 行
              try:
                  address = ipaddress.ip_address(parts[0])
              except (ValueError, IndexError):
                  return False, None, None

              if len(parts) < 2:
                  return True, None, "Hosts mapping has no hostname"

              if not (address.is_unspecified or address.is_loopback):
                  return (
                      True,
                      None,
                      "non-blocking Hosts IP mapping cannot be represented "
                      "as an equivalent Adblock-style block rule",
                  )

              domains = []

              for raw_domain in parts[1:]:
                  domain = canonical_domain(raw_domain)

                  if not domain:
                      return (
                          True,
                          None,
                          f"invalid hostname in Hosts mapping: {raw_domain}",
                      )

                  domains.append(domain)

              if not domains:
                  return True, None, "Hosts mapping contains no valid hostname"

              return True, [f"|{domain}^" for domain in domains], None

          def extract_badfilter(candidate: str):
              # Detect and strip $badfilter while preserving the target rule's other modifiers.
              # Split delimiters outside quotes so a client name may safely contain commas or "$".
              # Keep the @@ exception prefix: badfilter must disable the exact same
              # allow/block rule, not accidentally turn an exception target into a block target.
              parts, split_error = split_outside_quotes(candidate, "$")
              if split_error or len(parts) != 2:
                  return False, candidate

              pattern, modifier_text = parts
              tokens, split_error = split_outside_quotes(modifier_text, ",")
              if split_error:
                  return False, candidate

              if not any(token.strip().lower() == "badfilter" for token in tokens):
                  return False, candidate

              remaining = [
                  token.strip() for token in tokens
                  if token.strip().lower() != "badfilter"
              ]
              if remaining:
                  return True, pattern + "$" + ",".join(remaining)

              return True, pattern


          def classify_and_convert(line: str):
              # 对单行分类并转换，返回 (规则列表, 类型, 拒绝原因)
              # 类型为 "badfilter" 时，返回的规则是"被禁用的目标规则"，而不是要输出的规则
              candidate = line.strip()

              if not candidate:
                  return [], "empty", None

              if candidate.startswith(("!", "#")):
                  return [], "comment", None

              # 列表头部属于元数据，不是过滤规则
              if ADBLOCK_HEADER_RE.fullmatch(candidate):
                  return [], "comment", None

              # 先尝试按 Hosts 格式解析
              recognized, hosts_rules, hosts_error = parse_hosts_as_adguard(
                  candidate
              )

              if recognized:
                  if hosts_error:
                      return [], "rejected", hosts_error

                  return hosts_rules, "hosts", None

              # 先剥离 badfilter，再按 AdGuard 规则解析（得到规范化的目标规则）
              is_badfilter, stripped = extract_badfilter(candidate)
              converted, error = parse_adguard_dns_rule(stripped)

              if error:
                  return [], "rejected", error

              if is_badfilter:
                  return [converted], "badfilter", None

              return [converted], "adblock-style", None

          def compile_file(input_path: str, output_path: str, title: str):
              # 读取源文件、逐行转换并去重，返回生成结果（尚未写盘）
              source_path = Path(input_path)

              if not source_path.is_file():
                  raise RuntimeError(f"required input file does not exist: {input_path}")

              # 严格 UTF-8 解码：源文件损坏时直接报错，不静默替换
              with source_path.open("r", encoding="utf-8-sig", newline=None) as source:
                  input_lines = source.readlines()

              if not input_lines:
                  raise RuntimeError(f"input file is empty: {input_path}")

              stats = Counter()
              # 收集所有 badfilter 指向的目标规则，待全部解析完后统一移除
              badfilter_targets = set()
              rejected_samples = []
              rules = []
              seen = set()

              for line_number, original_line in enumerate(input_lines, 1):
                  line = original_line.rstrip("\r\n")

                  try:
                      converted, kind, reason = classify_and_convert(line)
                  except FatalConversionError as error:
                      # 补充文件名与行号后继续向上抛出
                      raise FatalConversionError(
                          f"{input_path}:{line_number}: {error}"
                      ) from error

                  # 记录被拒绝的行，并保留最多 25 条样例用于排查
                  if reason:
                      stats["rejected"] += 1
                      stats[f"reason: {reason}"] += 1
                      # Track rejected exceptions separately: they are potential allowlist
                      # semantic gaps, not ordinary unsupported blocking rules.
                      if line.strip().startswith("@@"):
                          stats["rejected: exception rule"] += 1

                      if len(rejected_samples) < 25:
                          rejected_samples.append(
                              f"{input_path}:{line_number}: "
                              f"{reason}: {line.strip()[:240]}"
                          )

                      continue

                  if not converted:
                      if kind not in ("empty", "comment"):
                          stats[f"skipped: {kind}"] += 1
                      continue

                  # badfilter 规则本身不输出，只记录其目标
                  if kind == "badfilter":
                      stats["converted: badfilter"] += 1
                      badfilter_targets.update(converted)
                      continue

                  stats[f"converted: {kind}"] += len(converted)

                  # 保持原有顺序去重
                  for rule in converted:
                      if rule in seen:
                          stats["duplicates"] += 1
                          continue

                      seen.add(rule)
                      rules.append(rule)

              # 应用 badfilter：全局移除与目标规则完全相同的规则（与出现顺序无关）
              # 注意：合并源已无上游边界，因此对所有上游来源一视同仁地生效
              if badfilter_targets:
                  removed_targets = {
                      rule for rule in rules if rule in badfilter_targets
                  }
                  rules = [
                      rule for rule in rules if rule not in badfilter_targets
                  ]
                  stats["badfilter: removed"] = len(removed_targets)
                  # 未匹配到任何规则的 badfilter（目标不存在或本就不被支持）
                  stats["badfilter: unmatched"] = len(
                      badfilter_targets - removed_targets
                  )

              # 转换结果为空时拒绝覆盖现有输出，防止发布空列表
              if not rules:
                  raise RuntimeError(
                      f"{input_path}: conversion produced zero rules. "
                      "Refusing to replace the existing output with an "
                      "empty or effectively unusable list."
                  )

              timestamp = datetime.datetime.now(
                  ZoneInfo("Asia/Singapore")
              ).strftime("%Y-%m-%d %H:%M:%S %Z")

              header = (
                  f"!Title: {title}\n"
                  "!Description: 一个汇总了多个DNS过滤器规则的DNS过滤器，每20分钟更新一次，确保即时同步上游减少误杀\n"
                  "!Homepage: https://github.com/REIJI007/Adblock-Rule-Collection\n"
                  "!LICENSE1: https://github.com/REIJI007/Adblock-Rule-Collection/blob/main/LICENSE-GPL%203.0\n"
                  "!LICENSE2: https://github.com/REIJI007/Adblock-Rule-Collection/blob/main/LICENSE-CC-BY-NC-SA%204.0\n"
                  f"!Generated: {timestamp}\n"
                  f"!RuleCount: {len(rules)}\n"
              )

              document = header + "\n" + "\n".join(rules) + "\n"

              return {
                  "input_path": input_path,
                  "output_path": output_path,
                  "title": title,
                  "document": document,
                  "rules": rules,
                  "stats": stats,
                  "input_lines": len(input_lines),
                  "rejected_samples": rejected_samples,
              }

          def validate_generated_document(result):
              # 在写入文件前逐条校验输出规则（忽略注释与元数据）
              # 要求：语法合法、已是规范形式、无重复、数量与生成结果一致
              output_path = result["output_path"]
              validated = 0
              seen = set()

              for line_number, line in enumerate(
                  result["document"].splitlines(), 1
              ):
                  candidate = line.strip()

                  if not candidate or candidate.startswith(("!", "#")):
                      continue

                  normalized, error = parse_adguard_dns_rule(
                      candidate,
                      allow_exact_anchor=True,
                  )

                  if error:
                      raise RuntimeError(
                          f"{output_path}:{line_number}: output validation "
                          f"failed: {error}: {candidate}"
                      )

                  # 重新规范化后必须与原文一致
                  if normalized != candidate:
                      raise RuntimeError(
                          f"{output_path}:{line_number}: output is not in "
                          f"canonical form: {candidate}"
                      )

                  if candidate in seen:
                      raise RuntimeError(
                          f"{output_path}:{line_number}: duplicate output rule: "
                          f"{candidate}"
                      )

                  seen.add(candidate)
                  validated += 1

              if validated == 0:
                  raise RuntimeError(
                      f"{output_path}: output validation found zero rules"
                  )

              if validated != len(result["rules"]):
                  raise RuntimeError(
                      f"{output_path}: validated rule count does not match "
                      "the generated rule count"
                  )

          def write_step_summary(results):
              # 将转换统计与拒绝报告写入 GitHub Actions 的步骤摘要
              summary_path = os.environ.get("GITHUB_STEP_SUMMARY")

              if not summary_path:
                  return

              lines = [
                  "## AdGuard DNS rule conversion",
                  "",
                  "| Input | Output | Input lines | Output rules | Rejected | Rejected exceptions | Duplicates | Badfilter removed | Badfilter unmatched |",
                  "|---|---|---:|---:|---:|---:|---:|---:|---:|",
              ]

              for result in results:
                  stats = result["stats"]
                  lines.append(
                      f"| `{result['input_path']}` "
                      f"| `{result['output_path']}` "
                      f"| {result['input_lines']} "
                      f"| {len(result['rules'])} "
                      f"| {stats['rejected']} "
                      f"| {stats['rejected: exception rule']} "
                      f"| {stats['duplicates']} "
                      f"| {stats['badfilter: removed']} "
                      f"| {stats['badfilter: unmatched']} |"
                  )

              for result in results:
                  stats = result["stats"]

                  lines.extend([
                      "",
                      f"### Rejection report: `{result['input_path']}`",
                      "",
                  ])

                  # 按出现次数降序、原因字典序排列
                  reasons = sorted(
                      (
                          (key.removeprefix("reason: "), value)
                          for key, value in stats.items()
                          if key.startswith("reason: ")
                      ),
                      key=lambda item: (-item[1], item[0]),
                  )

                  if reasons:
                      for reason, count in reasons:
                          lines.append(f"- {count} × {reason}")
                  else:
                      lines.append("- No rejected rules.")

                  if result["rejected_samples"]:
                      lines.extend([
                          "",
                          "Representative rejected lines:",
                          "",
                      ])
                      for sample in result["rejected_samples"]:
                          # 替换反引号，避免破坏 Markdown 行内代码
                          safe_sample = sample.replace("`", "'")
                          lines.append(f"- `{safe_sample}`")

              with open(summary_path, "a", encoding="utf-8") as summary:
                  summary.write("\n".join(lines) + "\n")

          def run_semantic_self_tests():
              # Guard the most important semantic boundaries against future regressions.
              cases = [
                  ("||Example.COM^", "||example.com^"),
                  ("@@||Example.COM^", "@@||example.com^"),
                  ("|Example.COM^", "|example.com^"),
                  ("@@|Example.COM^", "@@|example.com^"),
                  (
                      "||example.org^$denyallow=Sub.example.org|safe.org",
                      "||example.org^$denyallow=safe.org|sub.example.org",
                  ),
                  (
                      "||example.org^$dnstype=AAAA|A",
                      "||example.org^$dnstype=A|AAAA",
                  ),
                  (
                      "||example.org^$important,dnstype=AAAA|A",
                      "||example.org^$dnstype=A|AAAA,important",
                  ),
                  (
                      "||example.org^$client='Home, $ TV'",
                      "||example.org^$client='Home, $ TV'",
                  ),
                  (
                      "@@||example.org^$important",
                      "@@||example.org^$important",
                  ),
                  ("example.org", "|example.org^"),
                  (
                      "||example.org^$dnsrewrite=NOERROR;A;192.0.2.1",
                      "||example.org^$dnsrewrite=NOERROR;A;192.0.2.1",
                  ),
                  (
                      "||example.org^$dnsrewrite=2001:db8::1",
                      "||example.org^$dnsrewrite=2001:db8::1",
                  ),
                  ("/(^|\\.)example\\.org$/", "/(^|\\.)example\\.org$/"),
                  ("||*.example.org^", "||*.example.org^"),
              ]

              for source_rule, expected in cases:
                  actual, error = parse_adguard_dns_rule(source_rule)
                  if error or actual != expected:
                      raise RuntimeError(
                          "Semantic self-test failed for "
                          f"{source_rule!r}: got {actual!r}, error={error!r}"
                      )

              # Browser-context restrictions must not be stripped into broader DNS rules.
              _, error = parse_adguard_dns_rule("||example.org^$script")
              if not error:
                  raise RuntimeError(
                      "Semantic self-test failed: browser-only $script must be rejected"
                  )

              has_badfilter, target = extract_badfilter(
                  "||example.org^$denyallow=sub.example.org,badfilter"
              )
              if not has_badfilter or target != "||example.org^$denyallow=sub.example.org":
                  raise RuntimeError("Semantic self-test failed: badfilter target extraction")

              has_badfilter, target = extract_badfilter("@@||example.org^$badfilter")
              if not has_badfilter or target != "@@||example.org^":
                  raise RuntimeError("Semantic self-test failed: exception badfilter target extraction")

              # These are valid hostname-oriented regexes and must remain supported.
              valid_hostname_regexes = [
                  r"/^(?:\w+\.)*minepi\.com$/",
                  r"/^(a|c)\.[0-9a-f]{56}\.com$/",
                  r"/^(mon|tue|wed|thu|fri|sat|sun)\d{1,2}\.\w{2}\d{1,6}\w{4}\.com$/",
                  r"/[a-z]+\d+\.cnzz\./",
                  r"/99rejs/",
                  r"/Adloader/",
                  r"/community-ad/",
                  r"/^anon1.gt\d{6}.com$/",
              ]
              for source_rule in valid_hostname_regexes:
                  actual, error = parse_adguard_dns_rule(source_rule)
                  if error or actual != source_rule:
                      raise RuntimeError(
                          "Semantic self-test failed: valid hostname regex was rejected: "
                          f"{source_rule!r}; error={error!r}"
                      )

              # These patterns are sourced from URL, path, IP-range, port, or
              # Adblock-syntax matching. They must not enter a DNS hostname list.
              rejected_non_hostname_regexes = [
                  r"/(?::\/\/i1\.hoopchina\.com\.cn\/blogfile\/.+_\d{3}x\d{4})/",
                  r"/(?:^\|\|?|^)(10\.?[\d\.*]+)\|{0,1}$/",
                  r"/(?:^\|\|?|^)(127\.?[\d\.*]+)\|{0,1}$/",
                  r"/(?:^\|\|?|^)(172\.(?:1[6-9]|2[0-9]|3[0-1])\.[\d\.*]+)\|{0,1}$/",
                  r"/(?:^\|\|?|^)(192\.168\.?[\d\.*]+)\|{0,1}$/",
                  r"/(https?:\/\/)104\.154\..{100,}/",
                  r"/(https?:\/\/)104\.197\..{100,}/",
                  r"/(https?:\/\/)104\.198\..{100,}/",
                  r"/(https?:\/\/)130\.211\..{100,}/",
                  r"/(https?:\/\/)142\.91\.159\..{100,}/",
                  r"/(https?:\/\/)213\.32\.115\..{100,}/",
                  r"/(https?:\/\/)216\.21\..{100,}/",
                  r"/(https?:\/\/)217\.182\.11\..{100,}/",
                  r"/(https?:\/\/)51\.195\.31\..{100,}/",
                  r"/193.200.64.24:/",
                  r"/62.76.25.2(7|8)/",
                  r"/^!#/",
                  r"/^139\.45\.197\.2(4[0-9]|5[0-4])/",
                  r"/^139\.45\.197\.2(4[0-9]|5[0-4]):/",
                  r"/^139\.45\.19[5-7]\.\d{1,3}/",
                  r"/^142\.91\.159\.(1[5-9]\d|2[0-4]\d|250):(80|443)$/",
                  r"/^185\.238\.15[2-5]\.\d{1,3}$/",
                  r"/^185\.238\.15[2-5]\.\d{1,3}\$/",
                  r"/^188\.42\.84\.\d{1,3}/",
                  r"/^23\.109\.170\.(18[7-9]|19[0-2])$/",
                  r"/^23\.109\.73\.\d{3}/",
                  r"/^31\.184\.20[0-3]\.\d{1,3}$/",
                  r"/^31\.184\.20[0-3]\.\d{1,3}\$/",
                  r"/^5\.101\.4[67]\.\d{1,3}$/",
                  r"/^5\.101\.4[67]\.\d{1,3}\$/",
                  r"/^5\.188\.17[67]\.\d{1,3}$/",
                  r"/^5\.188\.17[67]\.\d{1,3}\$/",
                  r"/^5\.188\.19[45]\.\d{1,3}$/",
                  r"/^5\.188\.19[45]\.\d{1,3}\$/",
                  r"/^5\.188\.5[01]\.\d{1,3}$/",
                  r"/^5\.188\.5[01]\.\d{1,3}\$/",
                  r"/^5\.189\.21[89]\.\d{1,3}$/",
                  r"/^5\.189\.21[89]\.\d{1,3}\$/",
                  r"/^5\.8\.4[4-7]\.\d{1,3}$/",
                  r"/^5\.8\.4[4-7]\.\d{1,3}\$/",
                  r"/^88\.208\.22\.[1234]$/",
                  r"/^88\.208\.22\.[1234]:/",
                  r"/^94\.242\.247\.(2[0-9]|3[0-2])/",
                  r"/^94\.242\.247\.(2[0-9]|3[0-2]):/",
                  r"/^https:\/\/anon1.gt\d{6}.com/",
                  r"/^https?:\/\/.*\/easylist\/[0-9]{5}/",
                  r"/^\.fwmrm\.net\^/",
                  r"/^\|\|mkto-[\s\S]*\.com\^/",
                  r"/doseofporn.com\/[a-z]{0,5}[1-9]{0,5}[a-z]{0,5}[1-9][sS].*\.js/",
                  r"/gzc_.*\.mp4\?/",
                  r"/getjs?nadipdata$third-party,replace=/[\s\S]+openOriginalUrl[\s\S]+/openOriginalUrl()/",
                  r"/m.realgfporn.com\/[a-z]{1,13}[0-9]{1,13}[a-z]{1,13}\.js/",
              ]
              for source_rule in rejected_non_hostname_regexes:
                  actual, error = parse_adguard_dns_rule(source_rule)
                  if not error:
                      raise RuntimeError(
                          "Semantic self-test failed: non-host regex was accepted: "
                          f"{source_rule!r}; normalized={actual!r}"
                      )

              print("Semantic self-tests passed.")


          run_semantic_self_tests()

          # 待处理的 输入文件 -> 输出文件 映射（完整版与精简版）
          configurations = [
              {
                  "input": "ADBLOCK_RULE_COLLECTION.txt",
                  "output": "ADBLOCK_RULE_COLLECTION_DNS.txt",
                  "title": "Adblock-Rule-Collection-DNS",
              },
              {
                  "input": "ADBLOCK_RULE_COLLECTION_Lite.txt",
                  "output": "ADBLOCK_RULE_COLLECTION_DNS_Lite.txt",
                  "title": "Adblock-Rule-Collection-DNS-Lite",
              },
          ]

          results = [
              compile_file(
                  config["input"],
                  config["output"],
                  config["title"],
              )
              for config in configurations
          ]

          # 全部转换并校验通过后才开始写盘，保证两个输出要么都更新、要么都不更新
          for result in results:
              validate_generated_document(result)

          # 先写入临时文件
          staged_files = []

          for result in results:
              output_path = Path(result["output_path"])
              temporary_path = output_path.with_name(
                  output_path.name + ".tmp"
              )

              with temporary_path.open(
                  "w",
                  encoding="utf-8",
                  newline="\n",
              ) as output:
                  output.write(result["document"])

              staged_files.append((temporary_path, output_path))

          # 再以原子操作替换正式输出文件
          for temporary_path, output_path in staged_files:
              os.replace(temporary_path, output_path)

          write_step_summary(results)

      - name: Commit and push changes
        run: |
          set -euo pipefail

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add -- \
            ADBLOCK_RULE_COLLECTION_DNS.txt \
            ADBLOCK_RULE_COLLECTION_DNS_Lite.txt

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update AdBlock DNS rules"

          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:main
