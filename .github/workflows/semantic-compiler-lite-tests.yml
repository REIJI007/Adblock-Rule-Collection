name: Semantic compiler Lite regression tests

on:
  pull_request:
    paths:
      - "Adblock_Rule_Generator_Lite.py"
      - ".github/workflows/semantic-compiler-lite-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-compiler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python source
        run: python -m py_compile Adblock_Rule_Generator_Lite.py
      - name: Run semantic regression checks
        run: python Adblock_Rule_Generator_Lite.py --self-test

  live-source-audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run strict audit against Lite live upstream sources
        id: audit
        shell: bash
        run: |
          set +e
          python Adblock_Rule_Generator_Lite.py --output /tmp/semantic-compiled-lite-filter.txt --report semantic-lite-live-audit.json
          code=$?
          echo "strict_compiler_exit_code=$code" > semantic-lite-live-audit-status.txt
          echo "Strict Lite compilation exit code: $code"
          # Keep this step alive so the audit report can still be uploaded.
          # The summary step fails the job if strict compilation was rejected.
          exit 0
      - name: Summarize strict Lite audit
        if: always()
        shell: bash
        run: |
          if [ ! -f semantic-lite-live-audit.json ]; then
            echo "::error::The Lite compiler did not produce a JSON report."
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("semantic-lite-live-audit.json").read_text(encoding="utf-8"))
          print("Target:", report.get("target"))
          print("Sources:", report.get("source_count"))
          print("Unique compiled rules:", report.get("unique_rule_count"))
          print("Sources skipped for target mismatch:", report.get("sources_skipped_by_target"))
          print("Input lines skipped by target:", report.get("input_lines_skipped_by_target"))
          print("Known target-incompatible rules:", report.get("target_excluded_rule_count"))
          print("Source fetch failures:", len(report.get("source_failures", [])))
          print("Unsupported in-scope rules:", report.get("unsupported_count"))
          PY
          code="$(sed -n 's/^strict_compiler_exit_code=//p' semantic-lite-live-audit-status.txt | tail -n 1)"
          if [ "${code:-unknown}" != "0" ]; then
            echo "::error::Strict Lite compilation failed (exit code ${code:-unknown}). Review the uploaded audit artifact."
            exit 1
          fi
      - name: Upload Lite live audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-lite-live-source-audit
          path: |
            semantic-lite-live-audit.json
            semantic-lite-live-audit-status.txt
          if-no-files-found: warn
